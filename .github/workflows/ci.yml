name: CI — P0 Regression + Build + Deploy

on:
  push:
    branches: [main, web-version, 'fix/**']
  pull_request:
    branches: [main, web-version]

jobs:
  test:
    name: P0 Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run P0 regression tests
        run: npx vitest run --reporter=verbose

      - name: TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Production Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Render (Webhook)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment hook..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping webhook (Render native auto-deploy from branch is active if configured in dashboard)."
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
